<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    // Pega o caminho (/area, etc) e redireciona para o domínio novo
    var path = window.location.pathname;
    var search = window.location.search;
    window.location.replace("https://portalsagrado.world" + path + search);
  </script>
</head>
<body>
  <p>Redirecionando para o Portal Sagrado...</p>
  <p>Se não for redirecionado, <a href="https://portalsagrado.world/area/">clique aqui</a>.</p>
</body>
</html>
