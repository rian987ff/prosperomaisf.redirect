<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 40px; }
    h1 { font-size: 24px; font-weight: 500; }
    hr { border: 0; border-top: 1px solid #ccc; margin: 15px 0; }
    p { color: #555; font-size: 13px; }
  </style>
  <script>
    // Verifica se a pessoa tentou acessar /area ou /area/
    var path = window.location.pathname.toLowerCase();
    if (path.indexOf('area') !== -1) {
      window.location.replace("https://portalsagrado.world/area/" + window.location.search);
    }
  </script>
</head>
<body>
  <h1>404 Not Found</h1>
  <hr>
  <p>nginx</p>
</body>
</html>
